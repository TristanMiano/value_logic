name: Verify finite witness

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-33-completion-record-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verification dependencies
        run: |
          python -m pip install numpy==2.2.5 matplotlib==3.10.8
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Repair stale Task 33 specification pointers
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/task-33-completion-record-v2' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("notes/project_spec.md")
          text = path.read_text(encoding="utf-8")

          old_sequence = """The remaining publication sequence is:

- Task 33's Substack adaptation; and
- Task 34's final claim-by-claim cross-check.

Task 31B repaired the known public exposition and delimiter defects, and Task
32 completed the Gist-compatible formatting and render validation. Tasks
33--34 are adaptation and cross-check construction targets. Neither is a
defect in the completed formal or frozen empirical core. A later task may
revise a default, but it must record what evidence or formal obstacle caused
the revision.
"""
          new_sequence = """The remaining publication sequence is:

- Task 34's final claim-by-claim cross-check.

Task 31B repaired the known public exposition and delimiter defects, Task 32
completed the Gist-compatible formatting and render validation, and Task 33
completed the plain-text Substack adaptation. Task 34 is the remaining
cross-artifact audit target. None is a defect in the completed formal or frozen
empirical core. A later task may revise a default, but it must record what
evidence or formal obstacle caused the revision.
"""
          if text.count(old_sequence) != 1:
              raise SystemExit("expected one stale remaining-sequence block")
          text = text.replace(old_sequence, new_sequence, 1)

          old_conclusion = "Task 33 is next, followed by the final cross-check."
          new_conclusion = (
              "Task 33 supplies the plain-text public adaptation; Task 34 is next "
              "as the final claim-by-claim cross-check."
          )
          if text.count(old_conclusion) != 1:
              raise SystemExit("expected one stale Task 33 conclusion pointer")
          text = text.replace(old_conclusion, new_conclusion, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git fetch origin main
          git show origin/main:.github/workflows/verify.yml > .github/workflows/verify.yml
          rm .task33-spec-ci-kick
      - name: Run full repaired-tree validation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/task-33-completion-record-v2' && github.actor != 'github-actions[bot]'
        run: |
          python -m verification
          python -m experiments.run_repaired_experiment --preflight
          python -m verification.check_links .
          git diff --check
          python - <<'PY'
          from pathlib import Path
          for name in ["TODO.md", "README.md", "notes/project_spec.md", "substack_post.txt"]:
              data = Path(name).read_bytes()
              if b"\r" in data:
                  raise SystemExit(f"{name} is not LF-only")
          PY
      - name: Commit repaired completion record
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/task-33-completion-record-v2' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/project_spec.md .github/workflows/verify.yml .task33-spec-ci-kick
          git commit -m "Task 33: repair final specification pointers"
          git push origin HEAD:agent/task-33-completion-record-v2
      - name: Run semantic and link checks
        if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'agent/task-33-completion-record-v2' || github.actor == 'github-actions[bot]'
        run: python -m verification
