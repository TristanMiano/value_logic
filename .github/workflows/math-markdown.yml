name: Check mathematical Markdown

on:
  push:
    paths:
      - '**/*.md'
      - 'v3/checks/math_markdown.py'
      - '.github/workflows/math-markdown.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'v3/checks/math_markdown.py'
      - '.github/workflows/math-markdown.yml'

permissions:
  contents: read

jobs:
  math-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check portable math source
        run: python v3/checks/math_markdown.py
