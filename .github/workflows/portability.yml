name: Checkout portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portability:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check tracked file and attribute lookup lengths
        run: python tools/check_repo_paths.py --checkout-root 'C:\Users\trist\projects\value_logic'
      - name: Verify relocated historical evidence bytes
        run: python tools/evidence_paths.py verify
      - name: Run portability and evidence preservation regressions
        run: python -m unittest verification.test_repo_paths verification.test_evidence_paths verification.test_relocated_links
